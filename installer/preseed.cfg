# nullptr Workstation — debian-installer preseed (PARTIAL by design).
#
# Only the account name is fixed. Everything that is personal or destructive
# stays interactive:
#   * language, keyboard, time zone, Wi-Fi: asked
#   * PASSWORD: asked twice (choose + confirm). It is NOT preseeded and no
#     default password exists anywhere in the image.
#   * DISK PARTITIONING: fully manual/guided in the installer. Nothing is
#     preseeded here, so the installer always shows the partition plan and asks
#     "Write the changes to disks?" (default answer: No) before touching a disk.

# --- account: normal user "nullptr", home /home/nullptr, root login disabled ---
# With root login disabled the installer puts the first user in group "sudo";
# Debian's sudoers then requires that user's own password for sudo.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string nullptr
d-i passwd/username string nullptr
d-i passwd/user-default-groups string audio cdrom dip floppy video plugdev netdev input render sudo
# (passwd/user-password and passwd/user-password-again intentionally absent)

# --- hostname: suggested, still editable ---
d-i netcfg/get_hostname string nullptr
d-i netcfg/get_hostname seen false
d-i netcfg/get_domain string
d-i netcfg/get_domain seen false

# --- repositories: firmware for the ThinkPad's Wi-Fi/GPU/audio ---
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i hw-detect/load_firmware boolean true

# --- finish: configure NetworkManager/TLP and verify the user's home ---
d-i preseed/late_command string in-target /usr/local/sbin/nullptr-postinstall
