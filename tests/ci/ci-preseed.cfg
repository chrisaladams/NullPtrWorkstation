# CI-ONLY preseed for unattended installation tests in a throwaway QEMU VM.
# NEVER part of the ISO: it is served over QEMU's user network (preseed/url) by
# tests/ci/vm-test.sh. The real installer (installer/preseed.cfg) asks for the password
# and for partitioning confirmation. The password below exists only inside the test VM.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string nullptr
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean false
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean false

d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string nullptr
d-i passwd/username string nullptr
d-i passwd/user-password password nullptr-ci-test
d-i passwd/user-password-again password nullptr-ci-test
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-basicfilesystems/no_swap boolean false

d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true

# Same post-install step as the real ISO, plus (test VM only) a serial console so the
# CI can see when the system has booted.
d-i preseed/late_command string in-target /usr/local/sbin/nullptr-postinstall; \
  in-target sh -c 'sed -i "s|^GRUB_CMDLINE_LINUX=.*|GRUB_CMDLINE_LINUX=\"console=ttyS0,115200 console=tty0\"|" /etc/default/grub && update-grub'
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
