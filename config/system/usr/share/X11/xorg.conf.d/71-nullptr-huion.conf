# nullptr Workstation: Huion tablets (USB vendor 256c, kernel driver hid-uclogic) use
# xf86-input-wacom, so `xsetwacom` / `tablet-setup` can configure express keys, pen buttons,
# tablet area and pressure curve. (With xf86-input-libinput, express keys only send mouse
# clicks.) Named 71-* so it sorts after 40-libinput.conf and 70-wacom.conf.
# To go back to libinput: delete this file and restart the graphical session.
Section "InputClass"
    Identifier "nullptr: Huion tablets via xf86-input-wacom"
    MatchUSBID "256c:*"
    MatchIsTablet "on"
    MatchDevicePath "/dev/input/event*"
    Driver "wacom"
EndSection
