# nullptr Workstation — tmux. Prefix: Ctrl+b (the standard one).
# Windows: 1 editor · 2 build · 3 lazygit · 4 shell · 5 btop   (Ctrl+b 1..5)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-256color:RGB"
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows off      # keep 1..5 stable so Ctrl+b N always means the same thing
set -g detach-on-destroy off
set -g display-time 2500
setw -g mode-keys vi
set -g update-environment "DISPLAY XAUTHORITY SSH_AUTH_SOCK"

# friendlier splits that keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"
bind ? display-popup -w 90% -h 90% -E "keys"
bind P display-popup -w 70% -h 60% -E "projects"

# ---- Tokyo Night status bar
set -g status on
set -g status-interval 10
set -g status-position bottom
set -g status-style "bg=#1f2335,fg=#a9b1d6"
set -g status-left-length 30
set -g status-right-length 90
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold]  #S #[bg=#1f2335,fg=#7aa2f7] "
set -g status-right "#(nullptr-tmux-status)#[fg=#565f89]│ #[fg=#e0af68]%H:%M #[bg=#bb9af7,fg=#1a1b26,bold] Ctrl+b ? help "
setw -g window-status-format "#[fg=#565f89] #I #W "
setw -g window-status-current-format "#[bg=#3b4261,fg=#c0caf5,bold] #I #W #[default]"
setw -g window-status-separator ""
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#3b4261,fg=#c0caf5"
set -g mode-style "bg=#283457,fg=#c0caf5"
setw -g clock-mode-colour "#7aa2f7"
